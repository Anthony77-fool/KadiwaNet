<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendor Cart</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="../images/KadiwaNet_Logo.png" sizes="32x32">

  <!-- Custom CSS  -->
  <link rel="stylesheet" href="../css/custom-classes.css">
  <link rel="stylesheet" href="css/vendor_styles.css">
  <link rel="stylesheet" href="css/vendor_orders_styles.css">

  <!--Bootstrap link-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

  <!-- BS ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- FontAwesome Icons -->
  <script src="https://kit.fontawesome.com/da97a1e785.js" crossorigin="anonymous"></script>

  <!-- Google Fonts  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Loved+by+the+King&family=Over+the+Rainbow&family=Roboto:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

  <!-- CDN for JQUERY -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  
</head>
<body class="bg-white">
  
  <!-- KadiwaNet Navbar -->
  <nav class="navbar navbar-expand-lg navbar-light shadow-sm px-4 py-2">
    <div class="container-fluid">

      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center" href="home.html">
        <img src="../images/KadiwaNet_Logo.png" alt="KadiwaNet Logo" width="60" height="45" class="me-2">
        <span class="fw-bold">KadiwaNet</span>
      </a>

      <!-- Mobile Toggle -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#kadiwaNavbar" aria-controls="kadiwaNavbar" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Navbar Content -->
      <div class="collapse navbar-collapse justify-content-between" id="kadiwaNavbar">

        <!-- ✅ Search Bar (always visible, not hidden on mobile) -->
        <form class="d-flex mx-auto my-3 my-lg-0 w-100" role="search" style="max-width: 400px;">
          <div class="input-group w-100">
            <span class="input-group-text bg-white border-end-0">
              <i class="fa-solid fa-magnifying-glass text-secondary"></i>
            </span>
            <input class="form-control border-start-0" type="search" placeholder="Search products, farmers..." aria-label="Search">
          </div>
        </form>

        <!-- ✅ Navigation Icons -->
        <ul class="navbar-nav mx-auto text-center mt-2 mt-lg-0 d-flex flex-wrap justify-content-center">
          <li class="nav-item mx-2">
            <a href="vendor_homepage.html" class="nav-link nav-icon">
              <i class="fa-solid fa-house fs-5"></i><br>
              <small>Home</small>
            </a>
          </li>
          <li class="nav-item mx-2">
            <a href="vendor_farmers.html" class="nav-link nav-icon">
              <i class="fa-solid fa-people-group fs-5"></i><br>
              <small>Farmers</small>
            </a>
          </li>
          <li class="nav-item mx-2">
            <a href="vendor_messages.html" class="nav-link nav-icon">
              <i class="fa-solid fa-envelope fs-5"></i><br>
              <small>Messages</small>
            </a>
          </li>
          <li class="nav-item mx-2">
            <a href="vendor_orders.html" class="nav-link nav-icon">
              <i class="fa-solid fa-box fs-5"></i><br>
              <small>Orders</small>
            </a>
          </li>
          <li class="nav-item mx-2 position-relative">
            <a href="vendor_cart.html" class="nav-link nav-icon position-relative">
              <i class="fa-solid fa-cart-shopping fs-5 text-success"></i><br>
              <small class="text-success">Cart</small>
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">
                2
              </span>
            </a>
          </li>
        </ul>

        <!-- ✅ Notifications & Profile -->
        <div class="d-flex align-items-center justify-content-center mt-3 mt-lg-0">
          <!-- Notifications -->
          <button class="btn btn-light position-relative me-3">
            <i class="fa-solid fa-bell fs-5 text-secondary"></i>
            <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
          </button>

          <!-- Profile Dropdown -->
          <div class="dropdown">
            <a class="d-flex align-items-center text-decoration-none dropdown-toggle text-success" href="#" id="userDropdown" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              <img src="../images/farmer-images/12_05_2024 10_10_06 am.png" alt="User Profile" width="40" height="40" class="rounded-circle me-2">
              <span class="fw-semibold text-dark">Mike Jann</span>
            </a>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm" aria-labelledby="userDropdown">
              <li><a class="dropdown-item" href="profile.html"><i class="fa-solid fa-user me-2 text-success"></i>Profile</a></li>
              <li><a class="dropdown-item" href="settings.html"><i class="fa-solid fa-gear me-2 text-success"></i>Settings</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item text-danger" href="logout.html"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a></li>
            </ul>
          </div>
        </div>

      </div>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="chat-main py-5">
    <div class="container">
      <header class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold">Your Cart</h2>
        <div class="d-flex align-items-center">
          <!-- Select All Toggle -->
          <i class="bi bi-check2-circle text-success fs-2 me-2 cursor-pointer  d-none"></i><!--select all-->
          <i class="bi bi-circle text-success fs-3 me-2 cursor-pointer"></i><!-- unselect -->
          <h3 class="fs-4 mb-0" id="selected-count">0 Selected Orders</h3>
        </div>
      </header>

      <div class="row g-4">

        <!-- Cart Item -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card shadow-sm h-100 crop-card" data-selected="0">
            <img src="../images/crop_images/mango.jpg" class="card-img-top crop-img" alt="Mango">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title fw-bold">Mango</h5>
              <p class="text-success fw-semibold mb-2">₱150 / kg</p>

              <div class="d-flex align-items-center mb-3">
                <button class="btn btn-outline-secondary btn-sm me-2 decrement-btn">-</button>
                <input type="number" class="form-control text-center p-1 quantity-input" value="1" min="1" style="width: 60px;">
                <button class="btn btn-outline-secondary btn-sm ms-2 increment-btn">+</button>
              </div>

              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fw-semibold total-price">Total: ₱150</span>
                <button class="btn btn-danger btn-sm remove-btn"><i class="bi bi-trash"></i> Remove</button>
              </div>
            </div>
          </div>
        </div>

        <!-- Another Cart Item -->
        <div class="col-12 col-md-6 col-lg-4">
          <div class="card shadow-sm h-100 crop-card" data-selected="0">
            <img src="../images/crop_images/banana.avif" class="card-img-top crop-img" alt="Banana">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title fw-bold">Banana</h5>
              <p class="text-success fw-semibold mb-2">₱80 / kg</p>

              <div class="d-flex align-items-center mb-3">
                <button class="btn btn-outline-secondary btn-sm me-2 decrement-btn">-</button>
                <input type="number" class="form-control text-center p-1 quantity-input" value="2" min="1" style="width: 60px;">
                <button class="btn btn-outline-secondary btn-sm ms-2 increment-btn">+</button>
              </div>

              <div class="mt-auto d-flex justify-content-between align-items-center">
                <span class="fw-semibold total-price">Total: ₱160</span>
                <button class="btn btn-danger btn-sm remove-btn"><i class="bi bi-trash"></i> Remove</button>
              </div>
            </div>
          </div>
        </div>

      </div>

      <!-- Checkout Button -->
      <div class="text-center mt-5">
        <button class="btn btn-success btn-lg px-5">Proceed to Checkout</button>
      </div>
    </div>
  </main>

  <!-- Script for functionality -->
  <script src="js/vendor_cart_js.js"></script>

</body>
</html>
