<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmer Transactions</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="../images/KadiwaNet_Logo.png" sizes="32x32">

  <!-- Custom CSS  -->
  <link rel="stylesheet" href="../css/custom-classes.css">
  <link rel="stylesheet" href="farmer-css/farmer-styles.css">

  <!--Bootstrap link-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

  <!-- BS ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- FontAwesome Icons -->
  <script src="https://kit.fontawesome.com/da97a1e785.js" crossorigin="anonymous"></script>

  <!-- Google Fonts  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Loved+by+the+King&family=Over+the+Rainbow&family=Roboto:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

  <!-- CDN for JQUERY -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body class="w-100 vh-100 bg-color overflow-hidden">

  <!-- Navbar top -->
  <div class="px-5">

    <!-- Header -->
    <header class="navbar navbar-expand-lg navbar-light bg-light px-5 py-2">
      <!-- Logo -->
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="../images/KadiwaNet_Logo.png" alt="KadiwaNet Logo" width="70" height="50" class="me-2">
        <span class="fw-bold">KadiwaNet</span>
      </a>

      <!-- Search bar (wider) -->
      <form class="d-flex mx-auto" role="search" style="width: 40%;"> <!-- adjust width as needed -->
        <div class="input-group w-100">
          <!-- Icon inside input -->
          <span class="input-group-text bg-white cursor-pointer">
            <i class="fa-solid fa-magnifying-glass cursor-pointer"></i>
          </span>
          <input class="form-control border-start-0" type="search" placeholder="Search..." aria-label="Search">
        </div>
      </form>

      <!-- Notification and User -->
      <div class="d-flex align-items-center">
        <button class="btn btn-light position-relative me-3">
          <i class="fa-solid fa-bell"></i>
          <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-light rounded-circle"></span>
        </button>

        <!-- User profile with chevron at the bottom inside the profile picture -->
        <div class="d-flex align-items-center cursor-pointer">
          <!-- Name next to picture -->
          <h6 class="mb-0 ms-2">Mike Jann</h6>

          <!-- Profile picture wrapper -->
          <div class="position-relative">
            <img src="../images/farmer-images/12_05_2024 10_10_06 am.png" 
                alt="User Profile Picture" 
                width="45" height="45" 
                class="rounded-circle">
            
            <!-- Chevron inside the profile picture at bottom center -->
            <i class="bi bi-send-arrow-down-fill fs-5 position-absolute text-success" 
              style="top: 22px; left: 90%; transform: translateX(-50%);"></i>
          </div>

        </div>

      </div>
    </header>

  </div>

  <!-- Container for Aside and Main -->
  <div class="w-100 vh-100 d-flex flex-row">

    <!-- Navigation Aside Bar -->
    <aside class="w-25 border border-1 h-100 bg-white">
      <nav class="nav flex-column bg-white py-3">
        
        <!-- Dashboard Link -->
        <a class="nav-link mb-3 d-flex align-items-center text-decoration-none sidebar-hover" href="farmer-dashboard.html">
          <i class="bi bi-box-seam fs-3 me-4 "></i>
          <h4 class="mb-0 fw-normal">Dashboard</h4>
        </a>

        <!-- Inventory Link -->
        <a class="nav-link mb-3 d-flex align-items-center text-decoration-none sidebar-link" href="farmer-inventory.html">
          <i class="bi bi-columns-gap fs-4 me-4 text-white"></i>
          <h4 class="mb-0 fw-normal text-white fw-bold">Inventory</h4>
        </a>

        <!-- Transactions Link -->
        <a class="nav-link mb-3 d-flex align-items-center text-decoration-none sidebar-hover" href="farmer-products.html">
          <i class="bi bi-credit-card-2-back fs-3 me-4"></i>
          <h4 class="mb-0 fw-normal">Transactions</h4>
        </a>

        <!-- Notifications Link -->
        <a class="nav-link mb-3 d-flex align-items-center text-decoration-none sidebar-hover" href="farmer-orders.html">
          <i class="bi bi-bell fs-3 me-4"></i>
          <h4 class="mb-0 fw-normal">Notifications</h4>
        </a>

        <!-- Messages Link -->
        <a class="nav-link mb-3 d-flex align-items-center text-decoration-none sidebar-hover" href="farmer-messages.html">
          <i class="bi bi-chat fs-3 me-4"></i>
          <h4 class="mb-0 fw-normal">Messages</h4>
        </a>

        <!-- Reviews Link -->
        <a class="nav-link mb-3 d-flex align-items-center text-decoration-none sidebar-hover" href="farmer-reviews.html">
          <i class="bi bi-star fs-3 me-4"></i>
          <h4 class="mb-0 fw-normal">Reviews</h4>
        </a>

      </nav>
    </aside>

    <!-- Main Content Area -->
    <main class="w-75 bg-white px-5 py-4 h-100">
      <!-- Header Text -->
      <header class="d-flex flex-row justify-content-between">
        <h2 class="letter-spacing fw-bold">Inventory</h2>
        <!-- Button Group -->
        <div class="btn-group rounded-pill overflow-hidden d-flex justify-content-center align-items-center bg-success pe-3">
          <!-- Main button -->
          <button type="button" class="btn btn-success fs-6 fw-semibold letter-spacing cursor-pointer" 
          data-bs-toggle="modal" data-bs-target="#productModal">
            New
          </button>

          <!-- Icon with white circle -->
          <span class="text-success bg-white p-1 rounded-circle d-flex justify-content-center justify-content-center"
          role="button"
          data-bs-toggle="modal" data-bs-target="#productModal">
            <i class="fa-solid fa-plus cursor-pointer"></i>
          </span>
        </div>
      </header>
      

    </main>

  </div>

</body>
</html>
