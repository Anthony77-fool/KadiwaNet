<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verify Email</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="images/KadiwaNet_Logo.png" sizes="32x32">

  <!-- Cstm CSS Styles -->
  <link rel="stylesheet" href="css/custom-classes.css">

  <!--Bootstrap link-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

  <!-- BS ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- FontAwesome Icons -->
  <script src="https://kit.fontawesome.com/da97a1e785.js" crossorigin="anonymous"></script>

  <!-- Google Fonts  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Loved+by+the+King&family=Over+the+Rainbow&family=Roboto:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

  <!-- CDN for JQUERY -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>

  <!-- main container -->
  <div class="d-flex flex-row justify-content-evenly vh-100">

    <!-- This is sign-in image side -->
    <aside class="w-100 box-bg shadow-box d-flex flex-column justify-content-center align-items-center">

      <!-- Image Container -->
      <div class="image-container">
        <img src="images/KadiwaNet_Gif.gif" alt="This is KadiwaNet Hero Image">
      </div>

      <!-- Text Container -->
      <div class="d-flex flex-column justify-content-center align-items-center letter-spacing">
        <h1 class="fw-bolder">KadiwaNet</h1>
        <h6 class="fw-medium">Ani ng Magsasaka, Kita nang Tuwiran.</h6>
      </div>

      <!-- Links Container-->
       <div class="d-flex flex-row gap-4 mt-4">
        <i class="fa-brands fa-facebook fs-3"></i>
        <i class="fa-brands fa-linkedin fs-3"></i>
        <i class="fa-brands fa-instagram fs-3"></i>
        <i class="fa-brands fa-google fs-3"></i>
       </div>

    </aside>

    <!-- This is sign-in inputs side -->
    <main class="w-100 d-flex flex-column justify-content-center align-items-center">

      <!-- Sign In Form -->
      <form action="" class="h-and-w signin-box py-5">

        <!-- Header Title -->
        <header class="text-center pb-4">
          <h2 class="fw-bold letter-spacing">Create an account</h2>
          <h6 class="fw-normal letter-spacing">Verify Email Address to get started!</h6>
        </header>

        <!-- Input Fields -->
        <div class="d-flex flex-column align-items-center">

          <!-- Email Address & Password -->
          <input type="email" class="form-control mb-3 w-75" placeholder="Email Address" required>

          <!-- Sign In Button -->
          <button type="button"
                  id="openPinModal"
                  class="cursor-pointer w-75 btn-h btn btn-success border-0 rounded-3 fs-3 fw-bold mt-2 text-white">
            Send Code
          </button>

          <!-- Sign Up Link -->
          <div class="d-flex flex-row justify-content-between cursor-pointer w-75 mt-2">
            <h6 class="fw-normal">Already have an account?</h6>
            <a href="sign-in.html" class="cursor-pointer fs-6 text-decoration-none text-success fw-bold">Click here</a>
          </div>

        </div>

      </form>

    </main>

  </div>

  <!-- Modal: Enter PIN -->
  <div class="modal fade" id="pinModal" tabindex="-1" aria-labelledby="pinModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content rounded-4 shadow">
        <div class="modal-header d-flex flex-row justify-content-between box-bg">
          <h5 class="modal-title fw-bold" id="pinModalLabel">Enter Verification PIN</h5>
          <i class="fa-solid fa-square-xmark cursor-pointer fs-2 text-success" data-bs-dismiss="modal" aria-label="Close"></i>
        </div>

        <div class="modal-body text-center">
          <p class="fw-semibold mb-4">
            Please enter the 6-digit code we sent to your email.
          </p>

          <div class="pin-wrapper d-flex justify-content-center gap-2">
            <input type="text" maxlength="1" class="pin-box form-control text-center fs-3" />
            <input type="text" maxlength="1" class="pin-box form-control text-center fs-3" />
            <input type="text" maxlength="1" class="pin-box form-control text-center fs-3" />
            <input type="text" maxlength="1" class="pin-box form-control text-center fs-3" />
            <input type="text" maxlength="1" class="pin-box form-control text-center fs-3" />
            <input type="text" maxlength="1" class="pin-box form-control text-center fs-3" />
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
            Cancel
          </button>
          <button type="button" class="btn btn-success" id="submitPinBtn">
            Verify
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification for PIN Verification -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="pinToast" class="toast align-items-center text-bg-danger border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body">
          Incorrect PIN. Please try again.
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="js/verify-email-code.js"></script>

</body>
</html>
