<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In Step 2</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="images/KadiwaNet_Logo.png" sizes="32x32">

  <!-- Cstm CSS Styles -->
  <link rel="stylesheet" href="css/custom-classes.css">

  <!--Bootstrap link-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

  <!-- BS ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- FontAwesome Icons -->
  <script src="https://kit.fontawesome.com/da97a1e785.js" crossorigin="anonymous"></script>

  <!-- Google Fonts  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Loved+by+the+King&family=Over+the+Rainbow&family=Roboto:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

  <!-- CDN for JQUERY -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

</head>
<body>

  <!-- main container -->
  <div class="d-flex flex-row justify-content-evenly h-100 border-0">

    <!-- This is sign-in image side -->
    <aside class="w-100 box-bg shadow-box d-flex flex-column justify-content-center align-items-center d-none d-lg-flex">

      <!-- Image Container -->
      <div class="image-container">
        <img src="images/KadiwaNet_Gif.gif" alt="This is KadiwaNet Hero Image">
      </div>

      <!-- Text Container -->
      <div class="d-flex flex-column justify-content-center align-items-center letter-spacing">
        <h1 class="fw-bolder">KadiwaNet</h1>
        <h6 class="fw-medium">Ani ng Magsasaka, Kita nang Tuwiran.</h6>
      </div>

      <!-- Links Container-->
       <div class="d-flex flex-row gap-4 mt-4 cursor-pointer">
        <i class="fa-brands fa-facebook fs-3 cursor-pointer"></i>
        <i class="fa-brands fa-linkedin fs-3 cursor-pointer"></i>
        <i class="fa-brands fa-instagram fs-3 cursor-pointer"></i>
        <i class="fa-brands fa-google fs-3 cursor-pointer"></i>
       </div>

    </aside>

    <!-- This is sign-in inputs side -->
    <main class="w-100 d-flex flex-column justify-content-center align-items-center px-3 px-md-5">

      <!-- Sign In Form -->
      <form action="" class="h-and-w signin-box pb-5 pt-3">

        <!-- This is btn back -->
         <a href="sign-up-1.html" class="container ps-4">
           <i class="fa-solid fa-square-caret-left fs-2 text-success cursor-pointer"></i>
         </a>

        <!-- Header Title -->
        <header class="text-center d-flex gap-3 flex-column pb-3">
          <h2 class="fw-bold letter-spacing">Create an account</h2>
          
          <!-- Steps Indicator -->
          <div class="d-flex justify-content-center align-items-center px-5">
            <i class="bi bi-1-circle-fill fs-2 opacity-50"></i>
            <hr class="hr-w mx-3 my-0 border-3 opacity-50">
            <i class="bi bi-2-circle-fill fs-2 text-success"></i>
            <hr class="hr-w mx-3 my-0 border-3 opacity-50">
            <i class="bi bi-3-circle-fill fs-2 opacity-50"></i>
          </div>


          <h6 class="fw-normal letter-spacing">Provide your basic information</h6>
        </header>

        <!-- Input Fields -->
        <div class="d-flex flex-column align-items-center">

          <!-- First Name, Middle Name, Last Name -->
          <input type="text" class="form-control mb-3 w-75" placeholder="First Name" required>
          <input type="text" class="form-control mb-3 w-75" placeholder="Middle Name" required>
          <input type="text" class="form-control mb-3 w-75" placeholder="Last Name" required>

           <!-- Container for Male or Female options-->
          <div class="btn-group w-50" role="group" aria-label="Select role">
            <button type="button" class="btn btn-role border-success border-3 bg-success text-white fw-semibold">
              <i class="bi bi-gender-male"></i>
              Male
            </button>
            <button type="button" class="btn btn-role border border-3 fw-normal">
              <i class="bi bi-gender-female"></i>
              Female
            </button>
          </div>

          <!-- Dropdown for selecting Province -->
          <div class="dropdown w-75 mt-3">
            <button class="btn border-0 w-100 fw-normal py-2 rounded-3 shadow-sm d-flex justify-content-between align-items-center" 
                    type="button" 
                    id="provinceDropdownButton"
                    data-bs-toggle="dropdown" 
                    aria-expanded="false">
              <span>Select Province</span>
              <i class="bi bi-caret-down-fill"></i>
            </button>
            <ul class="dropdown-menu w-100 rounded-3 shadow-sm" aria-labelledby="dropdownMenuButton" id="provinceDropdown">
              <!-- Provinces will be populated here -->
            </ul>
          </div>

          <!-- Dropdown for selecting Municipality -->
          <div class="dropdown w-75 mt-3">
            <button class="btn border-0 w-100 fw-normal py-2 rounded-3 shadow-sm d-flex justify-content-between align-items-center" 
                    type="button" 
                    id="municipalityDropdownButton" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false">
              <span>Select Municipality</span>
              <i class="bi bi-caret-down-fill"></i>
            </button>
            <ul class="dropdown-menu w-100 rounded-3 shadow-sm" aria-labelledby="dropdownMenuButton" id="municipalityDropdown">
              <!-- Municipalities will be populated here -->
            </ul>
          </div>

          <!-- Dropdown for selecting Barangay -->
          <div class="dropdown w-75 mt-3">
            <button class="btn border-0 w-100 fw-normal py-2 rounded-3 shadow-sm d-flex justify-content-between align-items-center" 
                    type="button" 
                    id="barangayDropdownButton" 
                    data-bs-toggle="dropdown" 
                    aria-expanded="false">
              <span>Select Barangay</span>
              <i class="bi bi-caret-down-fill"></i>
            </button>
            <ul class="dropdown-menu w-100 rounded-3 shadow-sm" aria-labelledby="dropdownMenuButton" id="barangayDropdown">
              <!-- Barangays will be populated here -->
            </ul>
          </div>

          <!-- Sign In Button -->
          <a href="sign-up-3-farmer.html" type="button"
                  id="openPinModal"
                  class="cursor-pointer w-75 btn-h btn btn-success border-0 rounded-3 fs-3 fw-bold mt-3 text-white">
            Proceed
          </a>

          <!-- Sign Up Link -->
          <div class="d-flex flex-row justify-content-between cursor-pointer w-75 mt-2">
            <h6 class="fw-normal">Already have an account?</h6>
            <a href="sign-in.html" class="cursor-pointer fs-6 text-decoration-none text-success fw-bold">Click here</a>
          </div>

        </div>

      </form>

    </main>

  </div>

  <footer class="text-center py-3 bg-black text-white border-0">
      <p class="mb-0">&copy; 2025 KadiwaNet. All rights reserved.</p>
  </footer>

   <!-- Script for clicking options -->
  <script src="js/signUp-2-ui.js"></script>
  <script src="js/address-dropdown.js"></script>

</body>
</html>
