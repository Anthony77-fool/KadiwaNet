<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <!-- FAVICON -->
  <link rel="icon" type="image/png" href="images/KadiwaNet_Logo.png" sizes="32x32">

  <!-- Cstm CSS Styles -->
  <link rel="stylesheet" href="css/custom-classes.css">

  <!--Bootstrap link-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

  <!-- BS ICONS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

  <!-- FontAwesome Icons -->
  <script src="https://kit.fontawesome.com/da97a1e785.js" crossorigin="anonymous"></script>

  <!-- Google Fonts  -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Loved+by+the+King&family=Over+the+Rainbow&family=Roboto:ital,wght@0,100..900;1,100..900&family=Unkempt:wght@400;700&display=swap" rel="stylesheet">

</head>
<body>

  <!-- main container -->
  <div class="d-flex flex-row justify-content-evenly vh-100">

    <!-- This is sign-in inputs side -->
    <main class="w-100 d-flex flex-column align-items-center">

      <!-- Logo for head -->
      <header class="d-flex flex-row justify-content-start align-items-center w-100 mt-2">
        <img src="images/KadiwaNet_Logo.png" alt="KadiwaNet Logo" class="logo-size">
        <h1 class="fw-bolder letter-spacing">KadiwaNet</h1>
      </header>

      <!-- Sign In Form -->
      <form action="" class="h-and-w signin-box">
        <!-- Header Title -->
        <header class="text-center p-5">
          <h2 class="fw-bold letter-spacing">Sign In</h2>
        </header>

        <!-- Input Fields -->
        <div class="d-flex flex-column align-items-center">

          <!-- Email Address & Password -->
          <input type="email" class="form-control mb-3 w-75" placeholder="Email Address" required>
          <input type="password" class="form-control mb-3 w-75" placeholder="Password" required>

          <!-- Remember Me & Forgot Password -->
          <div class="d-flex flex-row justify-content-between w-75">
            <div class="d-flex flex-row">
              <input type="checkbox" name="remember-me" id="remember-me" class="form-check-input cursor-pointer me-2">
              <label for="remember-me" class="cursor-pointer fs-6">Remember Me</label>
            </div>
            <a href="#" class="cursor-pointer fs-6 text-decoration-none text-success fw-bold">Forgot Password?</a>
          </div>

          <!-- Sign In Button -->
          <button type="submit" class="cursor-pointer w-75 btn-h mt-3 box-bg border-0 rounded-3 fs-3 fw-bold mt-5 text-white">Sign In</button>

          <!-- Sign Up Link -->
          <div class="d-flex flex-row justify-content-between cursor-pointer w-75 mt-2">
            <h6 class="fw-normal">Doesn't have an account?</h6>
            <a href="#" class="cursor-pointer fs-6 text-decoration-none text-success fw-bold">Click here</a>
          </div>

        </div>

      </form>

    </main>
    <!-- This is sign-in image side -->
    <aside class="w-100 box-bg shadow-box d-flex flex-column justify-content-center align-items-center">

      <!-- Image Container -->
      <div class="image-container">
        <img src="images/Kadiwa-gif-unscreen.gif" alt="This is KadiwaNet Hero Image">
      </div>

      <!-- Text Container -->
      <div class="d-flex flex-column justify-content-center align-items-center letter-spacing">
        <h1 class="fw-bolder">KadiwaNet</h1>
        <h6 class="fw-medium">Ani ng Magsasaka, Kita nang Tuwiran.</h6>
      </div>

      <!-- Links Container-->
       <div class="d-flex flex-row gap-4 mt-4">
        <i class="fa-brands fa-facebook fs-3"></i>
        <i class="fa-brands fa-linkedin fs-3"></i>
        <i class="fa-brands fa-instagram fs-3"></i>
        <i class="fa-brands fa-google fs-3"></i>
       </div>

    </aside>

  </div>

</body>
</html>
